server {
    listen 80 default_server reuseport;
    server_name _;
    
    location /videos/ {
        alias /var/www/media/;
        mp4;
        mp4_buffer_size       1m;
        mp4_max_buffer_size   10m;
        mp4_start_key_frame   on;
	send_timeout 60s;
	limit_rate 125k;
	keepalive_timeout 65s;
    }
}
